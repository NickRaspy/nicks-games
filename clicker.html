<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кликер</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 16px 16px 22px;
    text-align: center;
    font-family: system-ui, sans-serif;
    color: var(--tg-theme-text-color, CanvasText);
  }
  .label { margin: 0; font-size: 14px; }
  #count { margin: 2px 0 12px; font: 700 40px/1.15 ui-monospace, monospace; }
  button {
    width: 100%;
    max-width: 320px;
    min-height: 48px;
    border: 0;
    border-radius: 12px;
    background: var(--tg-theme-button-color, #146ac1);
    color: var(--tg-theme-button-text-color, #fff);
    font: 600 17px system-ui, sans-serif;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
</style>
<p class="label">Нажатий</p>
<p id="count" aria-live="polite">0</p>
<button id="tap" type="button">+1</button>
<script>
  const countLabel = document.getElementById('count');
  const tapButton = document.getElementById('tap');
  const storageKey = 'clicker-count';
  let count = 0;

  try {
    const savedCount = Number(localStorage.getItem(storageKey));
    if (Number.isSafeInteger(savedCount) && savedCount >= 0) count = savedCount;
  } catch {
    // Keep the counter in memory when storage is unavailable.
  }

  countLabel.textContent = String(count);
  tapButton.addEventListener('click', () => {
    count = Math.min(count + 1, Number.MAX_SAFE_INTEGER);
    countLabel.textContent = String(count);
    try {
      localStorage.setItem(storageKey, String(count));
    } catch {
      // The current count is still usable.
    }
  });
</script>
</html>
